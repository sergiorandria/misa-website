name: CI — verify + deploy

on:
  push:
    branches: [dev, main, "fix/**", "feat/**"]
  pull_request:
    branches: [dev, main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Verify /mit base in dist
        run: |
          grep -q 'href="/mit/' dist/index.html || (echo "Missing /mit/ base" && exit 1)
          grep -q 'src="/mit/assets/' dist/index.html || (echo "Missing /mit/assets/" && exit 1)
          test -f dist/.htaccess && grep -q "RewriteBase /mit/" dist/.htaccess || (echo "Missing .htaccess" && exit 1)
          echo "✓ /mit/ hosting verified"

  deploy:
    needs: build-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on server (your 4 commands, no sudo)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          debug: true
          sync: true
          script: |
            set -e
            cd ~/misa-website
            echo "→ git fetch (with token)"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/sergiorandria/misa-website.git
            git fetch origin
            git reset --hard origin/main
            git remote set-url origin https://github.com/sergiorandria/misa-website.git
            echo "→ nvm setup"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.local/share/fnm:$PATH" 2>/dev/null || true
            export PATH="$HOME/.nvm/versions/node/v20.20.2/bin:$PATH" 2>/dev/null || true
            which node; which npm; node -v; npm -v
            echo "→ npm install"
            npm ci
            echo "→ npm run build"
            npm run build
            echo "→ verify /mit/"
            grep -q 'href="/mit/' dist/index.html
            grep -q 'RewriteBase /mit/' dist/.htaccess
            echo "→ copy to DocumentRoot — keep .nvm"
            rsync -av --delete --exclude='misa-website' --exclude='.nvm' --exclude='.fnm' --exclude='.cache' --exclude='.npm' dist/ /var/www/html/mit/
            rsync -av --delete --exclude='misa-website' --exclude='.nvm' --exclude='.fnm' --exclude='.cache' --exclude='.npm' dist/ ../ 2>/dev/null || true
            echo "✓ deployed to /var/www/html/mit"
            ls -la /var/www/html/mit/ | head -20
            ls -la ../ | head -20
