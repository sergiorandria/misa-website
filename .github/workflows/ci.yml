name: CI — verify + deploy

on:
  push:
    branches: [dev, main, "fix/**", "feat/**"]
  pull_request:
    branches: [dev, main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Verify /mit base in dist
        run: |
          grep -q 'href="/mit/' dist/index.html || (echo "Missing /mit/ base" && exit 1)
          grep -q 'src="/mit/assets/' dist/index.html || (echo "Missing /mit/assets/" && exit 1)
          test -f dist/.htaccess && grep -q "RewriteBase /mit/" dist/.htaccess || (echo "Missing .htaccess" && exit 1)
          echo "✓ /mit/ hosting verified"

  deploy:
    needs: build-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on server (your 4 commands, no sudo)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ~/misa-website
            echo "→ git fetch (with token to avoid 'could not read Username')"
            # Use GITHUB_TOKEN for https fetch — fixes "could not read Username for https://github.com" in non-interactive shell
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/sergiorandria/misa-website.git
            git fetch origin
            git reset --hard origin/main
            # Restore original https URL without token (keep repo clean)
            git remote set-url origin https://github.com/sergiorandria/misa-website.git
            echo "→ nvm setup (load node for npm)"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            # Fallbacks: fnm, common nvm paths, /opt/node
            export PATH="$HOME/.local/share/fnm:$PATH" 2>/dev/null || true
            export PATH="$HOME/.nvm/versions/node/v20.20.2/bin:$PATH" 2>/dev/null || true
            export PATH="/opt/node/bin:$PATH" 2>/dev/null || true
            which node || echo "node not found"
            which npm || echo "npm not found"
            node -v || true
            npm -v || true
            echo "→ npm install"
            npm ci
            echo "→ npm run build"
            npm run build
            echo "→ verify /mit/"
            grep -q 'href="/mit/' dist/index.html
            grep -q 'RewriteBase /mit/' dist/.htaccess
            echo "→ copy to DocumentRoot (~/ == /var/www/html/mit)"
            # cp -r dist/* .. misses .htaccess, use rsync to include dotfiles and delete stale files
            # exclude misa-website so we don't copy the repo into itself / delete it
            rsync -av --delete --exclude='misa-website' dist/ ../
            echo "✓ deployed to /var/www/html/mit"
            ls -la ../ | head -20
